name: Recession monitor

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "45 14 * * 1-5"

permissions:
  contents: write

concurrency:
  group: recession-monitor-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install engine
        run: python -m pip install -e .
      - name: Run tests
        run: python -m unittest discover -s tests -v

  update-monitor:
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.actor != 'github-actions[bot]')
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install engine
        run: python -m pip install -e .
      - name: Run live monitor
        run: python -m recession_monitor.cli --as-of "$(date -u +%F)" --no-vintage-copy
      - name: Commit changed evidence and outputs
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw outputs reports
          if git diff --cached --quiet; then
            echo "No monitor changes to commit."
          else
            git commit -m "monitor: update $(date -u +%F)"
            git push
          fi
